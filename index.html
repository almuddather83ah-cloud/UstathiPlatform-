<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>منصة أستاذي التعليمية</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#18202a}header{background:#fff;border-bottom:1px solid #e7eaf0;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;color:#1457d9}.nav{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 15px;font-size:14px;cursor:pointer}.primary{background:#1457d9;color:#fff}.danger{background:#d92d20;color:#fff}.outline{background:#fff;border:1px solid #cbd3df}.hidden{display:none!important}.container{width:min(1120px,92%);margin:24px auto}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);padding:28px;border-radius:18px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#5d6673}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{border:1px solid #d4dbe6;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.filter.active{background:#1457d9;color:#fff;border-color:#1457d9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.course,.panel{background:#fff;border:1px solid #e5e9f0;border-radius:16px;overflow:hidden}.cover{font-size:52px;text-align:center;padding:24px;background:#eef4ff}.body{padding:16px}.tag{display:inline-block;background:#edf3ff;color:#1457d9;padding:5px 8px;border-radius:7px;font-size:12px}.body h3{margin:10px 0 7px}.body p{color:#66717f;line-height:1.7}.meta{display:flex;justify-content:space-between;color:#6c7582;font-size:12px;margin:10px 0}.panel{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:16px;text-align:center}.stat b{display:block;font-size:24px;color:#1457d9}.stat span{font-size:13px;color:#697382}.lesson{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eef0f4;align-items:center}.materials a,.lesson a{display:inline-block;margin-top:7px;color:#1457d9;text-decoration:none}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:9px;font-size:15px}.field textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.hidden{display:none}.modalbox{background:#fff;border-radius:16px;width:min(780px,100%);max-height:90vh;overflow:auto;padding:20px}.close{float:left;cursor:pointer;font-size:22px}.quizQ{padding:14px 0;border-bottom:1px solid #eee}.quizQ button{margin:8px 5px 0 0;padding:9px 12px;border:1px solid #ccd4df;background:#fff;border-radius:8px;cursor:pointer}.empty{text-align:center;padding:25px;color:#737d8a}.adminTabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid #d4dbe6;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tab.active{background:#18202a;color:#fff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef0f4}.rowActions{display:flex;gap:6px;flex-wrap:wrap}.muted{color:#6b7582;font-size:13px}.mini{font-size:12px}.adminCard{border:1px solid #e5e9f0;border-radius:12px;padding:14px;margin:10px 0}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#f0f3f7;font-size:12px}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#1457d9}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero h1{font-size:24px}header{padding:12px 4%}.brand{font-size:16px}}
</style></head><body><header><div class="brand">منصة أستاذي التعليمية</div><div id="authArea" class="nav"></div></header>
<main class="container"><section class="hero"><h1>تعلم بذكاء، وتقدّم بثقة</h1><p>الدورات والدروس والاختبارات والمتابعة في مكان واحد.</p></section>
<section><div class="filters"><button class="filter active" onclick="loadCourses('all',this)">الكل</button><button class="filter" onclick="loadCourses('middle',this)">المرحلة المتوسطة</button><button class="filter" onclick="loadCourses('secondary',this)">المرحلة الثانوية</button></div><div id="courseGrid" class="grid"></div></section>
<section style="margin-top:22px"><div class="panel"><h2>لوحة المتابعة</h2><div id="dash" class="stats"></div></div></section>
<section id="adminSection" class="panel hidden" style="margin-top:22px"><h2>لوحة تحكم المعلم</h2><div class="adminTabs"><button class="tab active" onclick="adminTab('overview',this)">نظرة عامة</button><button class="tab" onclick="adminTab('courses',this)">الدورات</button><button class="tab" onclick="adminTab('content',this)">المحتوى والاختبارات</button><button class="tab" onclick="adminTab('students',this)">الطلاب</button></div><div id="adminContent"></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><span class="close" onclick="closeModal()">×</span><div id="modalBody"></div></div></div>
<script>const params=new URLSearchParams(location.search);const configuredApi=params.get('api')||localStorage.getItem('apiBase')||'http://10.0.2.2:3000';async function api(url,opt={}){const full=url.startsWith('http')?url:configuredApi.replace(/\/$/,'')+url;const headers={'Content-Type':'application/json',...(opt.headers||{})};const token=localStorage.getItem('token');if(token)headers.Authorization='Bearer '+token;const r=await fetch(full,{...opt,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'حدث خطأ في الاتصال بالخادم');return d}</script><script src="app.js"></script></body></html>
